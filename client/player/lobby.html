<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Lobby</title>

    <style>
    body{
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .screen{
        display:none;
        width:100vw;
        height:100vh;
    }

    .active{
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
    }

    #message_text{
        font-size:40px;
        font-weight:bold;
        text-align:center;
    }
    </style>

</head>
<body>

    <div id="lobby_screen" class="screen active">
        <h2 id="room_code">Room Code: ------</h2>
        <p id="players">Players: ------</p>
    </div>


    <div id="message_screen" class="screen">
        <div id="message_text">Waiting...</div>
        <div id="message_sub_text">Waiting...</div>
    </div>


    <div id="controller_screen" class="screen">

        <div id="joystick_zone" style="
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        "></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
    <script type="module" src="./lobby.js"></script>
</body>
</html>
