<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Lobby</title>

    <style>
    body{
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .screen{
        display:none;
        width:100vw;
        height:100vh;
    }

    .active{
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
    }

    #message_text{
        font-size:40px;
        font-weight:bold;
        text-align:center;
    }
    </style>

</head>
<body>

    <div id="lobby_screen" class="screen active">
        <h2 id="room_code">Room Code: ------</h2>
        <p id="players">Players: ------</p>
    </div>


    <div id="message_screen" class="screen">
        <div id="message_text">Waiting...</div>
        <div id="message_sub_text">Waiting...</div>
    </div>


    <div id="controller_screen" class="screen">

        <h2>Controller</h2>

        <label>X:</label>
        <input id="input_x" type="number" step="0.1" min="-1" max="1" value="0">

        <br><br>

        <label>Y:</label>
        <input id="input_y" type="number" step="0.1" min="-1" max="1" value="0">

        <br><br>

        <button id="send_input">Send Input</button>

    </div>

    <script type="module" src="./lobby.js"></script>
</body>
</html>
